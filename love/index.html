<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Для тебя 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FFF4F1;
    --blush: #FFDDE6;
    --rose: #F0587E;
    --rose-deep: #C93A63;
    --lilac: #D9C8FA;
    --peach: #FFD5BC;
    --ink: #4A2340;
    --font-hand: "Caveat", "Segoe Script", cursive;
    --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background: linear-gradient(135deg, var(--cream), var(--blush), var(--lilac), var(--peach), var(--cream));
    background-size: 400% 400%;
    animation: sky 28s ease-in-out infinite;
    overflow-x: hidden;
    line-height: 1.6;
  }
  @keyframes sky { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  .back {
    position: fixed; top: 14px; left: 14px; z-index: 20;
    padding: 8px 14px; border-radius: 999px;
    background: rgba(255,255,255,.7); backdrop-filter: blur(6px);
    color: var(--ink); font-size: .9rem; font-weight: 600; text-decoration: none;
  }
  .back:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--rose-deep); outline-offset: 3px; }

  /* плавающие сердечки на фоне */
  #floaters { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .float {
    position: absolute; bottom: -40px; opacity: 0;
    animation: rise linear forwards;
  }
  @keyframes rise {
    0%   { transform: translate(0,0) rotate(0); opacity: 0; }
    10%  { opacity: .85; }
    100% { transform: translate(var(--dx), -115vh) rotate(var(--rot)); opacity: 0; }
  }

  section { position: relative; z-index: 2; padding: 90px 20px; }
  .wrap { max-width: 860px; margin: 0 auto; }

  /* ---------- hero ---------- */
  .hero {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; gap: 10px;
  }
  .heart-big { width: clamp(110px, 24vw, 170px); animation: beat 1.8s ease-in-out infinite; filter: drop-shadow(0 12px 22px rgba(240,88,126,.45)); }
  .heart-big path { fill: var(--rose); }
  @keyframes beat {
    0%,40%,100% { transform: scale(1); }
    10% { transform: scale(1.14); }
    22% { transform: scale(1.04); }
    30% { transform: scale(1.12); }
  }
  h1 {
    font-family: var(--font-hand); font-weight: 700;
    font-size: clamp(3.6rem, 15vw, 8rem); line-height: 1; margin: 18px 0 0;
    color: var(--rose-deep);
  }
  h1 .ch {
    display: inline-block; opacity: 0;
    animation: drop .9s cubic-bezier(.3,1.6,.5,1) forwards;
    animation-delay: calc(var(--i) * .09s + .3s);
  }
  h1 .sp { width: .3em; }
  @keyframes drop { from { opacity: 0; transform: translateY(-60px) rotate(-12deg) scale(.6); } to { opacity: 1; transform: none; } }
  .sub { font-size: 1.15rem; max-width: 30ch; margin: 6px 0 0; opacity: 0; animation: fade 1.2s 1.4s forwards; }
  .days { font-weight: 800; color: var(--rose-deep); margin: 4px 0 0; opacity: 0; animation: fade 1.2s 1.8s forwards; }
  .days:empty { display: none; }
  @keyframes fade { to { opacity: 1; } }
  .down {
    margin-top: 34px; color: var(--ink); text-decoration: none; font-weight: 600;
    opacity: 0; animation: fade 1s 2.2s forwards, bob 2s 3s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(8px); } }

  /* ---------- письмо ---------- */
  h2 { font-family: var(--font-hand); font-weight: 700; font-size: clamp(2.3rem, 8vw, 3.6rem); line-height: 1.1; margin: 0 0 8px; color: var(--rose-deep); text-align: center; }
  .hint { text-align: center; margin: 0 0 30px; opacity: .8; }

  .envelope {
    position: relative; display: block; margin: 0 auto; border: 0; padding: 0; background: none; cursor: pointer;
    width: min(320px, 82vw); aspect-ratio: 320 / 210; perspective: 900px;
    filter: drop-shadow(0 14px 22px rgba(201,58,99,.3));
    transition: transform .3s, margin-top .9s cubic-bezier(.5,0,.2,1);
  }
  .envelope:hover { transform: translateY(-4px) rotate(-1.5deg); }
  .envelope.open { cursor: default; transform: none; margin-top: 7.5rem; }
  .env-body { position: absolute; inset: 0; border-radius: 12px; background: linear-gradient(#FF9DB5, #FF7C9C); }
  .env-front { position: absolute; inset: 0; border-radius: 12px; background: #FF8CA8; clip-path: polygon(0 100%, 50% 42%, 100% 100%); }
  .env-front::before { content: ""; position: absolute; inset: 0; background: #FFA9BF; clip-path: polygon(0 0, 50% 42%, 0 100%); }
  .env-front::after  { content: ""; position: absolute; inset: 0; background: #FFA9BF; clip-path: polygon(100% 0, 50% 42%, 100% 100%); }
  .env-flap {
    position: absolute; left: 0; right: 0; top: 0; height: 58%;
    background: #FF6F93; clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center; transition: transform .9s cubic-bezier(.5,0,.2,1), z-index 0s .45s;
    z-index: 3;
  }
  .envelope.open .env-flap { transform: rotateX(180deg); z-index: 0; }
  .seal {
    position: absolute; left: 50%; top: 44%; width: 52px; height: 52px; margin: -26px 0 0 -26px; z-index: 4;
    display: grid; place-items: center; font-size: 1.5rem; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FF5A7E, #B8264E); color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,.25); transition: transform .5s, opacity .5s;
    animation: beat 1.8s ease-in-out infinite;
  }
  .envelope.open .seal { transform: scale(0) rotate(180deg); opacity: 0; animation: none; }

  .letter { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 1.1s ease .5s; }
  .letter.open { grid-template-rows: 1fr; }
  .letter > div { overflow: hidden; }
  .paper {
    margin: 36px auto 0; max-width: 620px; padding: clamp(24px, 6vw, 46px);
    background: #FFFDF9; border-radius: 6px 22px 22px 22px;
    box-shadow: 0 16px 40px rgba(110,40,80,.18);
    background-image: repeating-linear-gradient(transparent 0 33px, rgba(240,88,126,.13) 33px 34px);
    font-size: 1.12rem; line-height: 34px;
  }
  .paper p { margin: 0 0 34px; opacity: 0; }
  .paper .to { font-family: var(--font-hand); font-size: 2.1rem; line-height: 34px; color: var(--rose-deep); }
  .paper .sign { font-family: var(--font-hand); font-size: 2rem; text-align: right; color: var(--rose-deep); margin-bottom: 0; }
  .letter.open .paper p { animation: lineIn .9s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i) * .85s + 1.4s); }
  @keyframes lineIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ---------- причины ---------- */
  .reasons { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 36px; }
  .reason {
    background: rgba(255,255,255,.72); backdrop-filter: blur(6px);
    border-radius: 26px; padding: 26px 22px;
    box-shadow: 0 10px 26px rgba(110,40,80,.12);
    opacity: 0; transform: translateY(40px) scale(.94);
    transition: opacity .8s ease, transform .8s cubic-bezier(.2,1.2,.4,1), box-shadow .3s;
    transition-delay: calc(var(--i) * .1s);
  }
  .reason.in { opacity: 1; transform: none; }
  .reason.in:hover { transform: translateY(-6px) rotate(-1deg); box-shadow: 0 18px 34px rgba(110,40,80,.2); transition-delay: 0s; }
  .reason .em { display: block; font-size: 2.3rem; line-height: 1; margin-bottom: 10px; }
  .reason p { margin: 0; font-weight: 600; }

  /* ---------- финал ---------- */
  .finale { text-align: center; padding-bottom: 130px; }
  .tap {
    margin: 30px auto 0; border: 0; background: none; cursor: pointer; padding: 10px;
    -webkit-tap-highlight-color: transparent; transition: transform .15s;
  }
  .tap svg { width: clamp(130px, 34vw, 200px); filter: drop-shadow(0 14px 24px rgba(240,88,126,.5)); animation: beat 1.8s ease-in-out infinite; }
  .tap path { fill: var(--rose); transition: fill .3s; }
  .tap:hover path { fill: #FF4D78; }
  .tap:active { transform: scale(.88); }
  .tap-msg { min-height: 3.2em; margin: 18px auto 0; max-width: 28ch; font-family: var(--font-hand); font-size: clamp(1.8rem, 6vw, 2.5rem); line-height: 1.15; color: var(--rose-deep); }
  .tap-msg.swap { animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  .count { margin-top: 6px; font-size: .95rem; opacity: .75; }

  .burst { position: fixed; z-index: 50; pointer-events: none; font-size: 1.6rem; will-change: transform, opacity; }

  @media (prefers-reduced-motion: reduce) {
    body, .heart-big, .seal, .tap svg, .down { animation: none; }
    h1 .ch, .sub, .days, .down { animation: none; opacity: 1; }
    .reason { opacity: 1; transform: none; transition: none; }
    .letter, .envelope, .env-flap { transition: none; }
    .letter.open .paper p { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<a class="back" href="../">← Все страницы</a>
<div id="floaters" aria-hidden="true"></div>

<section class="hero">
  <svg class="heart-big" viewBox="0 0 32 29.6" aria-hidden="true"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
  <h1 id="title" aria-label="Для тебя"></h1>
  <p class="sub" id="subtitle"></p>
  <p class="days" id="days"></p>
  <a class="down" href="#letter">листай вниз ↓</a>
</section>

<section id="letter">
  <div class="wrap">
    <h2>Тебе письмо</h2>
    <p class="hint" id="hint">Нажми на конверт</p>
    <button class="envelope" id="env" aria-expanded="false" aria-controls="letterBox" aria-label="Открыть письмо">
      <span class="env-body"></span>
      <span class="env-front"></span>
      <span class="env-flap"></span>
      <span class="seal" aria-hidden="true">♥</span>
    </button>
    <div class="letter" id="letterBox">
      <div><div class="paper" id="paper"></div></div>
    </div>
  </div>
</section>

<section id="reasons">
  <div class="wrap">
    <h2>За что я тебя люблю</h2>
    <div class="reasons" id="reasonList"></div>
  </div>
</section>

<section class="finale">
  <div class="wrap">
    <h2>И напоследок</h2>
    <p class="hint">Нажимай на сердце сколько хочешь</p>
    <button class="tap" id="tap" aria-label="Отправить сердечко">
      <svg viewBox="0 0 32 29.6" aria-hidden="true"><path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/></svg>
    </button>
    <p class="tap-msg" id="tapMsg" aria-live="polite"></p>
    <p class="count" id="count"></p>
  </div>
</section>

<script>
/* ============ ВСЁ, ЧТО МОЖНО МЕНЯТЬ — ЗДЕСЬ ============ */
const CONFIG = {
  title: "Для тебя",
  subtitle: "маленький уголок, в котором всё только про тебя",
  startDate: "",            // например "2025-02-14" — тогда появится счётчик дней вместе
  letter: [
    "Моя любимая,",
    "я долго думал, как лучше сказать всё, что чувствую, и решил сделать для тебя этот маленький уголок в интернете.",
    "С тобой даже обычные дни становятся особенными. Ты умеешь превратить любую мелочь в тёплое воспоминание.",
    "Спасибо, что ты рядом, что смеёшься над моими шутками и держишь за руку, когда это нужнее всего.",
    "Я люблю тебя — сегодня, завтра и всегда."
  ],
  signature: "Навсегда твой",
  reasons: [
    { e: "✨", t: "Твоя улыбка делает любой день лучше" },
    { e: "🫶", t: "Ты умеешь поддержать так, что сразу становится легче" },
    { e: "😂", t: "С тобой можно смеяться до слёз над какой-нибудь ерундой" },
    { e: "🌙", t: "Рядом с тобой спокойно и по-домашнему тепло" },
    { e: "🌷", t: "Ты замечаешь красоту в мелочах" },
    { e: "💫", t: "Ты просто есть, и этого достаточно, чтобы я был счастлив" }
  ],
  tapMessages: {
    1:  "Это тебе 💗",
    5:  "Ещё! Мне для тебя не жалко",
    10: "Ты моё солнышко ☀️",
    20: "Люблю тебя до луны и обратно 🌙",
    40: "Ты чемпионка по нажиманию на сердце! 🏆",
    60: "Я тебя очень-очень люблю ❤️"
  }
};
/* ======================================================== */

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);

/* заголовок по буквам */
const title = $("title");
[...CONFIG.title].forEach((c, i) => {
  const s = document.createElement("span");
  s.className = c === " " ? "ch sp" : "ch";
  s.style.setProperty("--i", i);
  s.textContent = c === " " ? "\u00A0" : c;
  s.setAttribute("aria-hidden", "true");
  title.appendChild(s);
});
title.setAttribute("aria-label", CONFIG.title);
document.title = CONFIG.title + " 🌸";
$("subtitle").textContent = CONFIG.subtitle;

/* счётчик дней */
if (CONFIG.startDate) {
  const d = Math.floor((Date.now() - new Date(CONFIG.startDate)) / 864e5);
  if (d >= 0) {
    const n = d % 100, m = d % 10;
    const w = n > 10 && n < 15 ? "дней" : m === 1 ? "день" : m > 1 && m < 5 ? "дня" : "дней";
    $("days").textContent = "Мы вместе уже " + d + " " + w;
  }
}

/* письмо */
const paper = $("paper");
CONFIG.letter.forEach((t, i) => {
  const p = document.createElement("p");
  p.textContent = t;
  p.style.setProperty("--i", i);
  if (i === 0) p.className = "to";
  paper.appendChild(p);
});
const sign = document.createElement("p");
sign.className = "sign";
sign.textContent = CONFIG.signature + " ♥";
sign.style.setProperty("--i", CONFIG.letter.length);
paper.appendChild(sign);

const env = $("env");
env.addEventListener("click", () => {
  if (env.classList.contains("open")) return;
  env.classList.add("open");
  env.setAttribute("aria-expanded", "true");
  env.setAttribute("aria-label", "Письмо открыто");
  $("letterBox").classList.add("open");
  $("hint").textContent = "Читай 💌";
  const r = env.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 14);
});

/* причины */
const list = $("reasonList");
CONFIG.reasons.forEach((r, i) => {
  const el = document.createElement("div");
  el.className = "reason";
  el.style.setProperty("--i", i % 3);
  el.innerHTML = '<span class="em" aria-hidden="true"></span><p></p>';
  el.querySelector(".em").textContent = r.e;
  el.querySelector("p").textContent = r.t;
  list.appendChild(el);
});
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
}, { threshold: .25 });
document.querySelectorAll(".reason").forEach((el) => io.observe(el));

/* сердечки, разлетающиеся от точки */
const EMOJI = ["💗", "💖", "💕", "🌸", "✨", "💘", "🌷"];
function burst(x, y, n) {
  if (reduce) return;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("span");
    s.className = "burst";
    s.textContent = EMOJI[Math.floor(Math.random() * EMOJI.length)];
    s.style.left = x + "px"; s.style.top = y + "px";
    s.style.fontSize = rand(1, 2.2) + "rem";
    document.body.appendChild(s);
    const a = rand(0, Math.PI * 2), d = rand(60, 190);
    const dx = Math.cos(a) * d, dy = Math.sin(a) * d - 60;
    s.animate([
      { transform: "translate(-50%,-50%) scale(.3)", opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1) rotate(${rand(-40, 40)}deg)`, opacity: 1, offset: .6 },
      { transform: `translate(calc(-50% + ${dx * 1.1}px), calc(-50% + ${dy + 80}px)) scale(.8)`, opacity: 0 }
    ], { duration: rand(900, 1500), easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => s.remove();
  }
}

/* фон: поднимающиеся сердечки */
const floaters = $("floaters");
function spawnFloat() {
  if (document.hidden || floaters.childElementCount > 22) return;
  const s = document.createElement("span");
  s.className = "float";
  s.textContent = EMOJI[Math.floor(Math.random() * EMOJI.length)];
  s.style.left = rand(0, 100) + "%";
  s.style.fontSize = rand(.9, 2) + "rem";
  s.style.setProperty("--dx", rand(-80, 80) + "px");
  s.style.setProperty("--rot", rand(-40, 40) + "deg");
  s.style.animationDuration = rand(9, 16) + "s";
  s.addEventListener("animationend", () => s.remove());
  floaters.appendChild(s);
}
if (!reduce) { for (let i = 0; i < 6; i++) setTimeout(spawnFloat, i * 400); setInterval(spawnFloat, 900); }

/* финальное сердце */
let taps = 0;
const tap = $("tap"), msg = $("tapMsg"), cnt = $("count");
const keys = Object.keys(CONFIG.tapMessages).map(Number).sort((a, b) => a - b);
tap.addEventListener("click", (e) => {
  taps++;
  const r = tap.getBoundingClientRect();
  const cx = e.clientX || r.left + r.width / 2, cy = e.clientY || r.top + r.height / 2;
  burst(cx, cy, taps % 10 === 0 ? 40 : 7);
  cnt.textContent = "Отправлено сердечек: " + taps;
  const k = keys.filter((x) => x <= taps).pop();
  if (k !== undefined && CONFIG.tapMessages[k] !== msg.textContent && taps === k) {
    msg.textContent = CONFIG.tapMessages[k];
    msg.classList.remove("swap"); void msg.offsetWidth; msg.classList.add("swap");
  }
});
</script>
</body>
</html>
